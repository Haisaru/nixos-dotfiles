### Hyprland configuration - ported from your niri config.kdl
### Wiki: https://wiki.hyprland.org/Configuring/
###
### MODIFIER GRAMMAR (same convention as the niri config):
###   $mod                 -> focus / act on the focused window
###   $mod SHIFT           -> move the window
###   $mod CTRL            -> monitors
###   $mod CTRL SHIFT       -> send the window to another monitor
###   $mod ALT             -> act on the whole workspace
### Non-directional chords (Mod+F, Mod+R, ...) are plain mnemonics.
###
### IMPORTANT MODEL DIFFERENCE FROM NIRI:
### Niri's workspaces are an infinite per-monitor vertical stack addressed
### "whichever workspace is currently 2nd on this monitor". Hyprland's
### workspaces are a fixed global set of numbers, each optionally pinned to a
### monitor with `workspace = N,monitor:NAME`. Mod+1..9 here jump to GLOBAL
### workspace N wherever it lives, not "the Nth workspace of this monitor".
### The `m+1`/`m-1` binds below are the closest equivalent to niri's
### focus-workspace-down/up (next/previous workspace on the CURRENT monitor).

$mod = SUPER
$term = kitty
$launcher = fuzzel
$browser = librewolf

#####################
### MONITORS       ###
#####################
# Run `hyprctl monitors` to get exact names/modes. Format:
#   monitor = NAME,RESOLUTIONxREFRESH,POSITION,SCALE
# Values below are filled in from your actual setup (niri msg outputs).
# Refresh rate does NOT need exact decimals here, unlike niri.
monitor = eDP-1,1920x1200@60,0x0,1.25
monitor = HDMI-A-1,2560x1440@59.951,1536x0,1
# Any other monitor not explicitly listed:
monitor = ,preferred,auto,1

# Pin workspaces to specific monitors if you want fixed placement
# (optional - remove if you'd rather let workspaces float freely):
# workspace = 1,monitor:eDP-1
# workspace = 2,monitor:HDMI-A-1

#####################
### AUTOSTART      ###
#####################
exec-once = waybar
exec-once = mako
exec-once = swaybg -i /home/jason/dotfiles/assets/active.jpg -m fill
exec-once = /home/jason/.config/niri/clipboard-watch.sh
exec-once = dbus-update-activation-environment --systemd --all
exec-once = xhost +SI:localuser:root 2>/dev/null || true

#####################
### INPUT          ###
#####################
input {
    kb_layout = us
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        # disable_while_typing = true
    }

    follow_mouse = 1
    # sensitivity = 0.0
}

# gestures {
#     workspace_swipe = true
# }

#####################
### LOOK & FEEL    ###
#####################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(9bdcffff)
    col.inactive_border = rgba(30485aaa)
    layout = dwindle
    resize_on_border = false
    allow_tearing = false
}

decoration {
    rounding = 0        # Strict square aesthetics, matches geometry-corner-radius 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 4
        color = rgba(00000080)
    }

    blur {
        enabled = true
        size = 3
        passes = 3
        noise = 0.03
        vibrancy = 1.15    # equivalent-ish to niri's saturation
        # xray = true      # like niri's default xray blur behavior
    }
}

animations {
    enabled = true
    # bezier / animation lines omitted - see
    # https://wiki.hyprland.org/Configuring/Animations/ to match niri's slowdown 1.0 feel
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = false
}

#####################
### WINDOW RULES   ###
#####################
# Picture-in-picture floats
windowrulev2 = float, class:^(firefox|librewolf)$,title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# Utility apps float
windowrulev2 = float, class:^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|satty)$

# Portal / share pickers float
windowrulev2 = float, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-gnome|hyprland-share-picker)$

# Browser/file-manager/discord open at full width equivalent:
# Hyprland's dwindle doesn't have niri's "default-column-width" concept;
# closest approximation is to just let them tile normally, or force
# maximize-on-open with a rule like this if you want them to fill the screen:
# windowrulev2 = fullscreenstate 1 1,class:^(librewolf|firefox|org.gnome.Nautilus|nautilus|vesktop|Vesktop)$

# Blur waybar/launcher/notification layers too (layer surfaces need this
# in addition to decoration.blur.enabled)
layerrule = blur, waybar
layerrule = blur, launcher
layerrule = blur, notifications

#####################
### KEYBINDS       ###
#####################
bind = $mod, Return, exec, $term
bind = $mod, D, exec, $launcher
bind = $mod, W, exec, $browser
bind = $mod, E, exec, $term -e yazi
bind = $mod, T, exec, $term -e nvim
bind = $mod SHIFT, T, exec, /home/jason/.config/waybar/scripts/theme-switcher.sh menu
bind = CTRL SHIFT, Escape, exec, $term -e btop
bind = $mod, X, exec, /home/jason/.config/waybar/scripts/wofi-power.sh

# Screen lock - pick a locker (hyprlock recommended) and uncomment.
# bindl = , switch:on:Lid Switch, exec, hyprlock
# bind = SUPER ALT, L, exec, hyprlock

# Window management
bind = $mod, Q, killactive
bind = $mod, C, centerwindow
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen, 1     # maximize (keeps gaps/bars)
bind = $mod SHIFT, F, fullscreen, 0  # true fullscreen

# Focus navigation
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Window movement
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Resizing (resizeactive takes a relative pixel delta)
bind = $mod, minus, resizeactive, -40 0
bind = $mod, equal, resizeactive, 40 0
bind = $mod SHIFT, minus, resizeactive, 0 -40
bind = $mod SHIFT, equal, resizeactive, 0 40

# Split direction toggle (closest analog to niri's column-width presets,
# since dwindle doesn't have preset proportions)
bind = $mod, R, togglesplit
bind = $mod, P, pseudo

# Groups (closest analog to niri's consume/expel-into-column)
bind = $mod, bracketleft,  changegroupactive, b
bind = $mod, bracketright, changegroupactive, f
bind = $mod, comma,  togglegroup
bind = $mod, period, moveoutofgroup

# Workspaces - GLOBAL numbers, not per-monitor like niri
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Next/previous workspace ON THE CURRENT MONITOR - the real analog to
# niri's focus-workspace-down/up
bind = $mod, Tab, workspace, previous
bind = $mod, Page_Down, workspace, m+1
bind = $mod, Page_Up,   workspace, m-1
bind = $mod, U, workspace, m+1
bind = $mod, I, workspace, m-1

bind = $mod SHIFT, Page_Down, movetoworkspace, m+1
bind = $mod SHIFT, Page_Up,   movetoworkspace, m-1
bind = $mod SHIFT, U, movetoworkspace, m+1
bind = $mod SHIFT, I, movetoworkspace, m-1

# ── Monitors ─────────────────────────────────────────────────────────────
bind = $mod CTRL, left,  focusmonitor, l
bind = $mod CTRL, right, focusmonitor, r
bind = $mod CTRL, H, focusmonitor, l
bind = $mod CTRL, L, focusmonitor, r

# Send the focused window to another monitor
bind = $mod CTRL SHIFT, left,  movewindow, mon:l
bind = $mod CTRL SHIFT, right, movewindow, mon:r
bind = $mod CTRL SHIFT, H, movewindow, mon:l
bind = $mod CTRL SHIFT, L, movewindow, mon:r

# Send the whole current workspace to another monitor
bind = $mod ALT, left,  movecurrentworkspacetomonitor, l
bind = $mod ALT, right, movecurrentworkspacetomonitor, r
bind = $mod ALT, H, movecurrentworkspacetomonitor, l
bind = $mod ALT, L, movecurrentworkspacetomonitor, r

bind = $mod SHIFT, P, dpms, toggle

# Scroll bindings (workspace switching on current monitor)
bind = $mod, mouse_down, workspace, m+1
bind = $mod, mouse_up,   workspace, m-1

# Screenshots - reusing your existing script; region/screen/window match
# roughly what you had bound in niri. grimblast or hyprshot are common
# alternatives if you don't already have a script that handles this.
bind = , Print, exec, /home/jason/.config/niri/screenshot.sh region
bind = $mod, Print, exec, /home/jason/.config/niri/screenshot.sh screen
# bind = CTRL, Print, exec, grimblast copysave screen
# bind = ALT, Print, exec, grimblast copysave active

# Hardware controls (Volume, Brightness, Media)
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Quit session - Hyprland's `exit` has NO confirmation dialog, unlike
# niri's `quit`. Consider wrapping in a confirm script (wlogout, wofi, etc.)
# if you want the same safety net.
bind = $mod SHIFT, E, exit
bind = CTRL ALT, Delete, exit
